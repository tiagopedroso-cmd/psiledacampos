<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conectar agenda — Leda Campos</title><style>:root{color-scheme:light;font-family:Georgia,serif;background:#f7f3ec;color:#322820}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);padding:36px;border:1px solid #dfd3c5;border-radius:20px;background:#fffaf5;box-shadow:0 18px 50px #4d302319}h1{margin:0 0 12px;font-size:32px}p{font-family:system-ui,sans-serif;line-height:1.55}label{display:grid;gap:8px;margin-top:24px;font-family:system-ui,sans-serif;font-weight:700}input{min-height:46px;padding:10px 12px;border:1px solid #b98a73;border-radius:8px;font:16px system-ui,sans-serif}button{width:100%;min-height:46px;margin-top:18px;border:0;border-radius:8px;background:#a65e40;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}.message{min-height:24px;margin:16px 0 0;color:#684233;font-family:system-ui,sans-serif}.ok{color:#385334}.error{color:#8a3324}</style></head>
<body><main class="card"><h1>Conectar agenda da Leda</h1><p>Área administrativa. Use o código definido nas variáveis seguras do projeto para autorizar somente a conta Google da Leda.</p><form id="connect-form"><label>Código administrativo<input name="secret" type="password" autocomplete="off" required></label><button type="submit">Continuar com Google</button></form><p id="message" class="message" role="alert"></p></main><script>const message=document.querySelector('#message'),status=new URLSearchParams(location.search).get('status');if(status==='conectado'){message.textContent='Agenda conectada com sucesso.';message.className='message ok';}if(status==='cancelado'){message.textContent='Autorização cancelada.';message.className='message error';}document.querySelector('#connect-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;message.textContent='Abrindo autorização…';try{const response=await fetch('/api/oauth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:new FormData(event.currentTarget).get('secret')})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível iniciar a conexão.');location.assign(data.url);}catch(error){message.textContent=error.message;message.className='message error';button.disabled=false;}});</script></body>
</html>
